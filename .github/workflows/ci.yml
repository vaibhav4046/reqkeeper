# The three claims this repository makes, checked on every push.
#
# Types are erased at run time by --experimental-strip-types and never checked, so the
# typecheck step is what makes the annotations in src/ mean anything. The harness step is
# the scored artifact: it fails the build if any refusal stops refusing.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: unit tests
        run: npm test

      # No network, no credentials: deterministic fault injection against an in-memory
      # provider that counts physical sends. Exits non-zero if a case stops behaving.
      - name: refusal harness
        run: npm run harness

      - name: build, and fail if the tree moved
        run: npm run build

      # A generated page that differs from the committed one means the deployed console cannot
      # be reproduced from a revision, which is the defect the baseline audit raised.
      - name: the built page must match the commit
        run: git diff --exit-code web api/_gen

      - name: race — N processes, one obligation, one payment
        run: npm run race

      - name: crash lottery — nine checkpoints, zero duplicates
        run: npm run crash

      # The agent surface, end to end against a fixture: propose, a human approval written by a
      # separate process, settle once, then ten replays that pay nothing. It is deterministic and
      # needs no credential, and it was broken for a whole round by a safety fix in the chain read
      # because nothing in CI ran it. A harness nobody runs is a harness that documents the past.
      - name: agent surface end to end
        run: npm run mcp:e2e

      # Credential-free by construction: it imports no provider and cannot move money.
      - name: verify every public claim
        run: npm run verify:all
